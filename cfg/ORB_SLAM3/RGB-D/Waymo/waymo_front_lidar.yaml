%YAML:1.0

File.version: "1.0"

# Waymo v2 FRONT camera at the 960x640 LiDAR projection resolution.
Camera.type: "PinHole"
Camera1.fx: 1029.523572
Camera1.fy: 1029.523572
Camera1.cx: 467.562404
Camera1.cy: 317.526238
Camera1.k1: 0.042396
Camera1.k2: -0.341657
Camera1.p1: 0.001806
Camera1.p2: -0.000055
Camera1.k3: 0.0

Camera.width: 960
Camera.height: 640
Camera.fps: 10
Camera.RGB: 1

# LiDAR has no stereo baseline. A conventional RGB-D pseudo-baseline is used;
# its product with ThDepth sets ORB-SLAM3's 75 m close/far threshold.
Stereo.b: 0.1
Stereo.ThDepth: 750.0

# Projected TIFF files store float32 metric depth directly in metres.
RGBD.DepthMapFactor: 1.0

ORBextractor.nFeatures: 2500
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

Viewer.KeyFrameSize: 0.5
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.8
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -10.0
Viewer.ViewpointZ: -20.0
Viewer.ViewpointF: 500.0
