%YAML:1.0

# Native nvblox TSDF mapping driven by the online ORB-SLAM RGB-D pose.
Nvblox.voxel_size_m: 0.05
Nvblox.max_integration_distance_m: 4.0
Nvblox.truncation_distance_vox: 4.0
Nvblox.max_weight: 5.0

# nvblox defaults. Set raycast_subsampling_factor to 1 for denser allocation
# at additional runtime cost.
Nvblox.raycast_subsampling_factor: 4
Nvblox.frame_subsampling: 1
Nvblox.color_frame_subsampling: 1
Nvblox.mesh_update_interval: 0

Nvblox.mesh_min_weight: 0.0001
Nvblox.weld_mesh_vertices: 1
Nvblox.undistort_input: 1
Nvblox.integrate_color: 1
Nvblox.save_map: 1
