%YAML:1.0

#--------------------------------------------------------------------------------------------
# Model Parameters
#--------------------------------------------------------------------------------------------

Model.sh_degree: 3 # maximum
Model.resolution: -1.0
Model.white_background: 0  # 0:false, 1 or other integer:true
Model.eval: 0  # 0:false, 1 or other integer:true

##############################################################################
# Pipeline-level parameters (only the ones VoxelMapper uses)
##############################################################################

Camera.z_near: 0.01
Monocular.inactive_geo_densify_max_pixel_dist: 1.0 # squared pixel distance
RGBD.min_depth: 0.0000000001
RGBD.max_depth: 40.0

Mapper.use_tsdf_mapping: 0 # 1 keeps legacy TSDF consumers available; leave 0 when nvblox is only an eval mesh
Mapper.use_tsdf_pruning: 0 # 0: do not use nvblox/TSDF inside voxel pruning
Mapper.use_tsdf_planning: 0 # 0: do not run ESDF path planning at shutdown
Mapper.tsdf_voxel_size_m: 0.05
Mapper.inactive_geo_densify: 1 # 0:false, 1 or other integer:true
Mapper.depth_cache: 10
Mapper.rgbd_fill_render_holes: 1 # RGB-D only: use real depth to fill pixels where current voxel render has holes
Mapper.rgbd_fill_render_holes_stride: 2
Mapper.rgbd_fill_render_holes_max_points_per_kf: 20000 # 0 disables cap

#da_prior
Mapper.depthanything_fill_holes: 0
Mapper.depthanything_densify_stride: 2
Mapper.depthanything_densify_min_sparse_anchors: 50
Mapper.depthanything_densify_alignment_mode: "orb" # orb/rendered/da_prior; da_prior uses PriorDA-style local KNN scale-shift alignment
Mapper.depthanything_da_prior_knn_k: 5
Mapper.depthanything_da_prior_distance_weighting: 1
Mapper.depthanything_da_prior_max_pixel_dist: 0.0 # 0 disables a max-distance cutoff for KNN anchors
Mapper.depthanything_fill_holes_initial_backfill: 1 # after initial ORB map creation, fill holes for the initial keyframes too
Mapper.depthanything_fill_holes_warmup: 0 # 1 delays gap filling until warmup_iter; 0 uses the previous immediate behavior

#flood fill hole filling parameters
Mapper.depthanything_fill_holes_warmup_iter: 200 # delay gap filling so ORB has accumulated more map points before each KF is densified
Mapper.fill_empty_cells: 0 # one-shot artificial dense-core fill;
Mapper.rendered_depth_insert: 0
Mapper.rendered_depth_insert_stride: 4
Mapper.rendered_depth_insert_frontier_radius_px: 1
Mapper.rendered_depth_insert_max_points_per_kf: 3000
Mapper.rendered_depth_insert_normal_offset_vox: 0.5
Mapper.rendered_depth_insert_require_real_adjacency: 1
Mapper.rendered_depth_insert_adjacency_radius_cells: 1

Mapper.min_num_initial_map_kfs:        20
Mapper.new_keyframe_times_of_use:    8 #8 for replica #2 for tum
Mapper.local_BA_increased_times_of_use: 0       
Mapper.loop_closure_increased_times_of_use_: 2  
Mapper.cull_keyframes:                 0
Mapper.large_rotation_threshold: 20.0 #20.0 #30.0 
Mapper.large_translation_threshold: 1.0 

GausPyramid.do: 1  # 0:false, 1 or other integer:true
GausPyramid.num_sub_levels: 2
GausPyramid.sub_level_times_of_use: 8

Pipeline.convert_SHs: 0  # 0:false, 1 or other integer:true

Record.keyframe_record_interval: 0 # 0:never, 1:always, others:periodically
Record.all_keyframes_record_interval: 0 # 0:never, 1:always, others:periodically
Record.record_rendered_image: 1 # 0:false, 1 or other integer:true
Record.record_ground_truth_image: 1 # 0:false, 1 or other integer:true
Record.record_loss_image: 0 # 0:false, 1 or other integer:true
Record.enable_rerun: 1  # 0:disable all rerun logging/saving, 1:enable
Record.rerun_max_keyframes: -1 # <=0:all keyframes, >0:only keyframes in [rerun_keyframe_start, start+N)
Record.rerun_keyframe_start: 0
Record.rerun_unstable: 0 # write unstable.rrd with voxels pruned by prune_recent_unstable
Record.save_nvblox_mesh_eval: 0 # RGB-D only: run nvblox and save one final reference mesh at shutdown
Record.load_saved_nvblox_mesh: 1 # RGB-D only: load an existing reference mesh instead of running nvblox
Record.saved_nvblox_mesh_path: "/home/dimitris/Photo-SLAM/results/tum_rgbd/rgbd_dataset_freiburg1_desk/nvblox/nvblox_color_mesh.ply"
Record.rerun_nvblox_mesh: 1 # log the saved/generated nvblox mesh in Rerun
Record.rerun_gt_mesh: 0 # log a reference GT mesh under world/gt/mesh
Record.rerun_gt_mesh_path: ""
Record.save_rendered_mesh_eval: 1 # 0:skip voxel_surface_mesh.ply shutdown export, 1:save it
Record.rerun_rendered_mesh_eval: 1 # log final voxel_surface_mesh.ply to world/voxel_model_mesh/final
Record.rendered_mesh_eval_voxel_size_m: 0.05 # final eval TSDF voxel size, comparable to HI-SLAM2 TSDF_VOXEL_SIZE
Record.rendered_mesh_eval_min_weight: 2.0 # final eval mesh extraction weight threshold, comparable to HI-SLAM2 TSDF_WEIGHT
Record.training_report_interval: 100 # 0:never, 1:always, others:periodically
Record.record_loop_ply: 0 # 0:false, 1 or other integer:true

##############################################################################
# SVRaster-style optimisation parameters
##############################################################################
Optimization.max_num_iterations: 30100
# SparseAdam param groups (match train.py)
Optimization.geo_lr: 0.1 #0.025 # very important 4x better than 8x
Optimization.sh0_lr: 0.04 #0.010 # very important
Optimization.shs_lr: 0.001 #0.00025 #important

# Optimizer hyper-params (match svraster cfg.optimizer)
Optimization.optim_beta1: 0.1
Optimization.optim_beta2: 0.99
Optimization.optim_eps: 1e-15

# MultiStep LR decay (like torch.optim.lr_scheduler.MultiStepLR)
# Use a YAML sequence for OpenCV FileStorage compatibility.
Optimization.lr_decay_ckpt: [19000] # [24]
Optimization.lr_decay_mult: 0.1

# --------------------------------------------------------------------------------------------
# Adaptive prune/subdivide (SVRaster schedule)
# --------------------------------------------------------------------------------------------
Optimization.adapt_from: 400
Optimization.adapt_every: 400
Optimization.prune_every: 600
Optimization.subdivide_every: 400
# Optimization.adapt_from: 650
# Optimization.adapt_every: 650
# Optimization.prune_every: 800
# Optimization.subdivide_every: 650

# Pruning heuristics
Optimization.filter_near_voxels: 1 # 0:false, 1:true, insertion-time mark_near filtering
Optimization.prune_far_voxels: 1 # 0:false, 1:true
Optimization.prune_near_voxels_geometric: 1 # 0:false, 1:true, prune-time near-to-camera geometry (also behind camera)
Optimization.prune_recent_unstable: 0
Optimization.prune_recent_keyframes: 3
Optimization.prune_recent_min_views_real: 3
Optimization.prune_recent_min_views_artificial: 3
Optimization.rendered_depth_candidate_promote_min_support: 3 # source keyframe + 2 more observations before promotion
Optimization.rendered_depth_candidate_prune_kf_age: 3
Optimization.final_special_prune_enable: 1

# Pruning
Optimization.prune_until: 15000
Optimization.prune_thres_init: 0.001 
Optimization.prune_thres_final: 0.01 #0.15
Optimization.prune_thres_final_at_target: 0.01
Optimization.prune_thres_init_artificial: 0.01
Optimization.prune_thres_final_artificial: 0.01 # used for artificial rendered-hole-fill candidates until promotion

# Subdivision
Optimization.subdivide_until: 15000
Optimization.subdivide_all_until: 0 #worse probably because of re-initialization of optimizer
Optimization.subdivide_samp_thres: 0.5 #0.7 #1.0
Optimization.subdivide_prop: 0.2 #0.1 #0.05
Optimization.subdivide_max_num: 10000000

# Total variation loss of density grid
Optimization.lambda_tv_density: 0 #1e-10
Optimization.tv_from: 0
Optimization.tv_until: 1000

# Data augmentation
Optimization.ss_aug_max: 0 #1.5 

# Per-point rgb loss
Optimization.lambda_R_concen: 0.00 #0.01 

# Distortion loss (encourage distribution concentration on ray)
Optimization.lambda_dist: 0.00
Optimization.dist_from: 2500

# Final transmittance should concentrate to either 0 or 1
Optimization.lambda_T_concen: 0.0
# Final transmittance should be 0
Optimization.lambda_T_inside: 0.0

# Consistency loss of rendered normal and derived normal from expected depth
Optimization.lambda_normal_dmean: 0.00
Optimization.n_dmean_from: 1000
Optimization.n_dmean_end: 15000
Optimization.n_dmean_ks: 3
Optimization.n_dmean_tol_deg: 90.0

# SSIM loss
Optimization.lambda_ssim : 0.0
Optimization.lambda_dssim: 0.02
Optimization.use_l1: 0
Optimization.use_huber: 0
Optimization.huber_thres: 0.03

# Sparse depth loss
Optimization.lambda_sparse_depth : 0.0
Optimization.sparse_depth_until : 15000

# Dense mono prior backend. Depth-Anything-V2-* keeps the old relative-depth path,
# while metric3d_vit_* uses WildGS-style Metric3D preprocessing/inference and
# ORB-aligned depth-space calibration.
Optimization.lambda_depthanythingv2: 0.01
Optimization.depthanythingv2_model_id: "depth-anything/Depth-Anything-V2-Small-hf" # metric3d_vit_small depth-anything/Depth-Anything-V2-Small-hf
# svraster: align DepthAnything to current rendered inverse-depth distribution inside the loss
# aligned: align the mono prior to sparse ORB/global depth and compare against that fixed target
# geosvr: GeoSVR-style patch-normalized mono-prior loss with optional uncertainty weighting
Optimization.depthanythingv2_loss_mode: "aligned"
Optimization.depthanythingv2_from: 1000
Optimization.depthanythingv2_end: 15000
Optimization.depthanythingv2_end_mult: 0.1
# geosvr
Optimization.depthanythingv2_overall: 0
Optimization.depthanythingv2_alpha_adjust: 0
Optimization.enable_da2_uncertainty: 0
Optimization.level_uncertainty_from: 0
Optimization.power_level_uncertainty: 1.0
Optimization.lambda_ascending: 0
Optimization.ascending_from: 1000
Optimization.lambda_rectify: 0
Optimization.rectifiy_from: 2000
Optimization.lambda_scaling_penalty: 0
Optimization.scaling_penalty_from: 1000
Optimization.scaling_penalty_end: 15000
Optimization.multi_view_weight_from_iter: 1000000000
Optimization.multi_view_interval: 1
Optimization.multi_view_anneal_scale: 0.0
Optimization.multi_view_ncc_weight: 0.05
Optimization.multi_view_geo_weight: 0.01
Optimization.multi_view_patch_size: 3
Optimization.multi_view_sample_num: 10240000
Optimization.multi_view_pixel_noise_th: 1.0
Optimization.voxel_dropout_min: 0.5

# Depth Anything V2 normal prior:
# - geosvr: derive normals directly from the mono prior as in GeoSVR
# - aligned: first align depth with ORB/global anchors, then derive normals
Optimization.lambda_depthanythingv2_normal: 0.00 #0.001
Optimization.depthanythingv2_normal_mode: "aligned"
Optimization.depthanythingv2_normal_from: 1000
Optimization.depthanythingv2_normal_end: 15000
Optimization.depthanythingv2_normal_end_mult: 0.1
Optimization.depthanythingv2_normal_ks: 3
Optimization.depthanythingv2_normal_tol_deg: 90.0

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------

VoxelViewer.glfw_window_width: 1400
VoxelViewer.glfw_window_height: 1050
VoxelViewer.image_scale: 0.5
VoxelViewer.image_scale_main: 1.0
VoxelViewer.camera_watch_dist: 0.000001
