%YAML:1.0

#--------------------------------------------------------------------------------------------
# Model Parameters
#--------------------------------------------------------------------------------------------

Model.sh_degree: 3 # maximum
Model.resolution: 64
Model.white_background: 0  # 0:false, 1 or other integer:true
Model.eval: 0  # 0:false, 1 or other integer:true

##############################################################################
# Pipeline-level parameters (only the ones VoxelMapper uses)
##############################################################################

Camera.z_near: 0.01
Camera.z_far: 100.0

Mapper.inactive_geo_densify:           1        # keep like Voxel
Mapper.min_num_initial_map_kfs:        20
Mapper.new_keyframe_times_of_use:      2
Mapper.local_BA_increased_times_of_use: 0       
Mapper.loop_closure_increased_times_of_use_: 2  
Mapper.cull_keyframes:                 0
Mapper.large_rotation_threshold:       30.0     # deg
Mapper.large_translation_threshold:    1.0      # m
Mapper.stable_num_iter_existence:      1

Pipeline.convert_SHs: 0  # 0:false, 1 or other integer:true
Pipeline.compute_cov3D: 0  # 0:false, 1 or other integer:true

Record.keyframe_record_interval: 0 # 0:never, 1:always, others:periodically
Record.all_keyframes_record_interval: 0 # 0:never, 1:always, others:periodically
Record.record_rendered_image: 1 # 0:false, 1 or other integer:true
Record.record_ground_truth_image: 1 # 0:false, 1 or other integer:true
Record.record_loss_image: 0 # 0:false, 1 or other integer:true
Record.training_report_interval: 10 # 0:never, 1:always, others:periodically
Record.record_loop_ply: 0 # 0:false, 1 or other integer:true

##############################################################################
# SVRaster-style optimisation parameters
##############################################################################

# Learning rate
Optimization.max_num_iterations:       30100     
Optimization.geo_lr_init:         0.00032
# Optimization.geo_lr_final:        0.00032
Optimization.geo_lr_delay_mult:   0.01
Optimization.geo_lr_max_steps:    24
Optimization.sh0_lr:                   0.0025   
Optimization.shs_lr:                   0.000125   
# Optimization.meta_accum_lr:            0.1

# Subdivision schedule
Optimization.percent_dense: 0.01
Optimization.lambda_dssim: 0.2

Optimization.densification_interval:   100
# Optimization.densify_from_iter: 800
# Optimization.densify_until_iter: 30000
# Optimization.densify_grad_threshold: 0.001

# Pruning schedule
Optimization.prune_from:               500
Optimization.prune_every:              100
Optimization.prune_until:              18000
Optimization.prune_threshold_init:     0.0001
Optimization.prune_threshold_final:    0.05
# Optimization.min_voxels:               512

Optimization.subdiv_from:              500
Optimization.subdiv_every:             100
Optimization.subdiv_until:             15000
Optimization.subdivide_samp_thres:    0.01
Optimization.subdivide_max_num:       1000
Optimization.subdivide_target_scale: 90.0
Optimization.subdivide_all_until:     0 # 0:never, others:until
# Optimization.subdiv_quantile:          0.25
# Optimization.subdiv_gradient_threshold: 1e-8

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------

VoxelViewer.glfw_window_width: 1400
VoxelViewer.glfw_window_height: 1050
VoxelViewer.image_scale: 0.5
VoxelViewer.image_scale_main: 1.0
VoxelViewer.camera_watch_dist: 0.000001