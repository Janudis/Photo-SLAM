%YAML:1.0

#--------------------------------------------------------------------------------------------
# Model Parameters
#--------------------------------------------------------------------------------------------

Model.sh_degree: 3 # maximum
Model.resolution: -1.0
Model.white_background: 0  # 0:false, 1 or other integer:true
Model.eval: 0  # 0:false, 1 or other integer:true

##############################################################################
# Pipeline-level parameters (only the ones VoxelMapper uses)
##############################################################################

Camera.z_near: 0.01
RGBD.min_depth: 0.0000000001
RGBD.max_depth: 40.0

Mapper.inactive_geo_densify: 1  # 0:false, 1 or other integer:true
Mapper.depth_cache: 10
Mapper.min_num_initial_map_kfs:        20
Mapper.new_keyframe_times_of_use:     8 #8 #2
Mapper.local_BA_increased_times_of_use: 0       
Mapper.loop_closure_increased_times_of_use_: 2  
Mapper.cull_keyframes:                 0
Mapper.large_rotation_threshold: 20.0 #20.0 #30.0 
Mapper.large_translation_threshold: 1.0 

GausPyramid.do: 1  # 0:false, 1 or other integer:true
GausPyramid.num_sub_levels: 2
GausPyramid.sub_level_times_of_use: 8

Pipeline.convert_SHs: 0  # 0:false, 1 or other integer:true

Record.keyframe_record_interval: 0 # 0:never, 1:always, others:periodically
Record.all_keyframes_record_interval: 0 # 0:never, 1:always, others:periodically
Record.record_rendered_image: 1 # 0:false, 1 or other integer:true
Record.record_ground_truth_image: 1 # 0:false, 1 or other integer:true
Record.record_loss_image: 0 # 0:false, 1 or other integer:true
Record.enable_rerun: 0   # 0:disable all rerun logging/saving, 1:enable
Record.rerun_final_only: 0 # 0:log rerun during run, 1:log only final voxel sets at shutdown
Record.rerun_max_keyframes: 50 # <=0:all keyframes, >0:only keyframes in [150, 150+N) as rerun cameras
Record.rendered_mesh_backend: 1 # 0:current SVRaster Python fuser/marching cubes, 1:shared C++ sparse TSDF backend
Record.record_depth_metrics: 0 # 0:false, 1:compute Depth L1 / F1 from rendered depth vs GT depth
Record.depth_f1_threshold_m: 0.01 # 1 cm
Record.training_report_interval: 100 # 0:never, 1:always, others:periodically
Record.record_loop_ply: 0 # 0:false, 1 or other integer:true

##############################################################################
# SVRaster-style optimisation parameters
##############################################################################
Optimization.max_num_iterations: 30100
# SparseAdam param groups (match train.py)
Optimization.geo_lr: 0.1 #0.025 # very important 4x better than 8x
Optimization.sh0_lr: 0.04 #0.010 # very important
Optimization.shs_lr: 0.001 #0.00025 #important

# Optimizer hyper-params (match svraster cfg.optimizer)
Optimization.optim_beta1: 0.1
Optimization.optim_beta2: 0.99
Optimization.optim_eps: 1e-15

# MultiStep LR decay (like torch.optim.lr_scheduler.MultiStepLR)
# Use a YAML sequence for OpenCV FileStorage compatibility.
Optimization.lr_decay_ckpt: [19000] # [24]
Optimization.lr_decay_mult: 0.1

# --------------------------------------------------------------------------------------------
# Adaptive prune/subdivide (SVRaster schedule)
# --------------------------------------------------------------------------------------------
# Optimization.adapt_from: 350
# Optimization.adapt_every: 350
# Optimization.prune_every: 600
# Optimization.subdivide_every: 350
Optimization.adapt_from: 650
Optimization.adapt_every: 650
Optimization.prune_every: 1000
Optimization.subdivide_every: 650

Optimization.densify_cooldown_iters: 50  # skip prune/subdivide for voxels younger than this many iters
Optimization.filter_near_voxels: 1 # 0:false, 1:true, only for fill_empty_cells_ camera filtering
Optimization.filter_far_voxels_on_insert: 0 # 0:false, 1:true
Optimization.prune_far_voxels: 1 # 0:false, 1:true
Optimization.prune_near_voxels_geometric: 1 # 0:false, 1:true, prune-time near-to-camera geometry (also behind camera)
Optimization.prune_recompute_dense_core: 1 # 0:reuse latest cached dense-core bbox, 1:recompute at each prune
Optimization.prune_recent_unstable: 0
Optimization.prune_recent_keyframes: 3
Optimization.prune_recent_min_views_real: 3
Optimization.prune_recent_min_views_artificial: 3
Optimization.prune_min_kf_age: 3
Optimization.prune_surface_keep_enable: 0
Optimization.prune_surface_keep_use_view: 0
Optimization.prune_surface_keep_use_size: 0
Optimization.final_special_prune_enable: 1
# Pruning
Optimization.prune_until: 15000
Optimization.prune_thres_init: 0.0001 
Optimization.prune_thres_final: 0.0005 #0.15
Optimization.prune_thres_final_at_target: 0.001
Optimization.prune_thres_init_artificial: 0.003
Optimization.prune_thres_final_artificial: 0.1

# Subdivision
Optimization.subdivide_until: 15000
Optimization.subdivide_all_until: 0 #worse probably because of re-initialization of optimizer
Optimization.subdivide_samp_thres: 0.6 #0.7 #1.0
Optimization.subdivide_prop: 0.15 #0.1 #0.05
Optimization.subdivide_samp_thres_at_target: 0.6
Optimization.subdivide_prop_at_target: 0.15
Optimization.subdivide_max_num: 10000000
Optimization.subdivide_force_to_target_size: 1  # 0:false(default behavior), 1:force refine to target size
Optimization.subdivide_target_vox_size: 0.05

# Regularization weights (set to 0 to disable)
Optimization.lambda_tv_density: 0 #1e-10
Optimization.tv_from: 0
Optimization.tv_until: 1000

Optimization.ss_aug_max: 0 #1.5 
Optimization.lambda_R_concen: 0 #0.01 
Optimization.lambda_dist: 0 #0.1 
Optimization.lambda_T_concen: 0.01   # SVRaster occupancy regularizer on transmittance
Optimization.lambda_T_inside: 0.01   # encourage low residual transmittance inside scene
Optimization.T_sharp_from: 0
Optimization.T_sharp_until: 0
Optimization.lambda_T_concen_end_mult: 1.0
Optimization.lambda_T_inside_end_mult: 1.0
Optimization.lambda_normal_dmean: 0.0
Optimization.n_dmean_from: 10000
Optimization.n_dmean_end: 20000
Optimization.n_dmean_ks: 3
Optimization.n_dmean_tol_deg: 90.0

Optimization.lambda_dssim: 0.2
Optimization.lambda_ssim : 0.0 #0.02
Optimization.lambda_sparse_depth : 0.02
Optimization.sparse_depth_until : 1500

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------

VoxelViewer.glfw_window_width: 1400
VoxelViewer.glfw_window_height: 1050
VoxelViewer.image_scale: 0.5
VoxelViewer.image_scale_main: 1.0
VoxelViewer.camera_watch_dist: 0.000001
