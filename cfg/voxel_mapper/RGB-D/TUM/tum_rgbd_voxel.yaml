%YAML:1.0

#--------------------------------------------------------------------------------------------
# Model Parameters
#--------------------------------------------------------------------------------------------

Model.sh_degree: 3 # maximum
Model.resolution: -1.0
Model.white_background: 0  # 0:false, 1 or other integer:true
Model.eval: 0  # 0:false, 1 or other integer:true

##############################################################################
# Pipeline-level parameters (only the ones VoxelMapper uses)
##############################################################################
Pipeline.convert_SHs: 0  # 0:false, 1 or other integer:true
Camera.z_near: 0.01
Monocular.inactive_geo_densify_max_pixel_dist: 1.0 # squared pixel distance
RGBD.min_depth: 0.0000000001
RGBD.max_depth: 40.0

Mapper.use_tsdf_mapping: 0 # 1: integrate RGB-D frames into the configured TSDF backend
Mapper.use_tsdf_pruning: 1 # 1: add conservative SVRecon-style positive/free-space TSDF pruning
Mapper.use_tsdf_planning: 0 # 0: do not run ESDF path planning at shutdown
Mapper.tsdf_backend: "svraster" # svraster: SDF stored on SVRaster grid points, nvblox: external nvblox TSDF
Mapper.tsdf_voxel_size_m: 0.05
Mapper.svraster_tsdf_refit_on_topology_change: 0 # 1: replay registered RGB-D KFs after insertion/subdivision so new corners receive TSDF
Mapper.tsdf_protect_surface_band_from_pruning: 0 # 1: prevent non-SDF pruning from deleting estimated TSDF surface-band voxels
Mapper.tsdf_prune_min_weight: 0.1
Mapper.tsdf_prune_surface_band_vox: 1.0
Mapper.tsdf_prune_min_valid_corners: 1
Mapper.tsdf_density_init: 0 # 1: initialize new SVRaster grid densities from TSDF with NeuS-style bell mapping
Mapper.tsdf_density_init_min_weight: 1.0
Mapper.tsdf_density_init_trunc_vox: 4.0 # normalize TSDF by this many configured TSDF voxels
Mapper.svraster_tsdf_max_integration_distance_m: 4.0 # nvblox-style projective integration range for SVRaster TSDF
Mapper.svraster_tsdf_inverse_square_weighting: 1 # nvblox default TSDF measurement weighting
Mapper.svraster_tsdf_max_weight: 5.0 # nvblox default TSDF accumulated-weight cap
Mapper.sdf_evidence_densify: 0 # 1:create hidden TSDF evidence voxels in RGB-D depth bands, promote confident surface-band cells
Mapper.sdf_evidence_zero_crossing_refresh: 0 # 1:insert renderable voxels from TSDF edge zero-crossing samples
Mapper.tsdf_subdivide_near_zero_crossing: 0 # 1:prefer subdividing renderable voxels with TSDF surface/zero-crossing support
Mapper.tsdf_subdivide_min_weight: 0.5
Mapper.tsdf_subdivide_surface_band_vox: 2.0
Mapper.tsdf_subdivide_min_valid_corners: 2
Mapper.tsdf_density_init_bell_a: 0.1 # normalized TSDF offset used for bell calibration
Mapper.tsdf_density_init_bell_b: 0.5 # bell opacity at |F| = bell_a before alpha rescale
Mapper.tsdf_density_init_alpha_min: 0.0002
Mapper.tsdf_density_init_alpha_max: 0.5

Mapper.fill_empty_cells: 1 # one-shot artificial dense-core fill; separate from rendered_depth_insert
Mapper.dense_core_pcd_density_rate: 0.005 # larger=tighter fill_empty_cells dense-core bbox, smaller=larger bbox
Mapper.inactive_geo_densify: 0 # 0:false, 1 or other integer:true
Mapper.rgbd_inactive_geo_initial_backfill: 1 # run inactive-geo densify once for initial RGB-D keyframes after createFromPcd
Mapper.depth_cache: 10
Mapper.rgbd_fill_render_holes: 0 # RGB-D only: use real depth to fill pixels where current voxel render has holes
Mapper.rgbd_fill_render_holes_stride: 2
Mapper.rgbd_fill_render_holes_max_points_per_kf: 0 # 0 disables cap
Mapper.rgbd_surface_band_support: 0 # if 1, fill render holes with samples around RGB-D depth instead of one point
Mapper.rgbd_surface_band_half_width_ratio: 0.05
Mapper.rgbd_surface_band_sample_spacing_vox: 1.0

Mapper.min_num_initial_map_kfs:        10
Mapper.new_keyframe_times_of_use:    2
Mapper.local_BA_increased_times_of_use: 0       
Mapper.loop_closure_increased_times_of_use_: 2  
Mapper.cull_keyframes:                 0
Mapper.large_rotation_threshold: 20.0
Mapper.large_translation_threshold: 1.0 

GausPyramid.do: 1  # 0:false, 1 or other integer:true
GausPyramid.num_sub_levels: 2
GausPyramid.sub_level_times_of_use: 8

Record.keyframe_record_interval: 0 # 0:never, 1:always, others:periodically
Record.all_keyframes_record_interval: 0 # 0:never, 1:always, others:periodically
Record.record_rendered_image: 1 # 0:false, 1 or other integer:true
Record.record_ground_truth_image: 1 # 0:false, 1 or other integer:true
Record.record_loss_image: 0 # 0:false, 1 or other integer:true
Record.training_report_interval: 100 # 0:never, 1:always, others:periodically
Record.record_loop_ply: 0 # 0:false, 1 or other integer:true

Record.enable_rerun: 0  # 0:disable all rerun logging/saving, 1:enable
Record.rerun_max_keyframes: -1 # <=0:all keyframes, >0:only keyframes in [rerun_keyframe_start, start+N)
Record.rerun_keyframe_start: 0
Record.run_whole_run: 1 # write whole_run.rrd with keyframes, trajectory, live voxels/source, accumulated pruned voxels, and nvblox mesh
Record.rerun_unknown: 0 # write unknown.rrd with live SDF-unknown voxels and source topics
Record.rerun_unstable: 0 # write unstable.rrd with voxels pruned by prune_recent_unstable
Record.run_sdf_pruned_nvblox: 0 # write run_sdf_pruned_nvblox.rrd using saved nvblox mesh as pseudo-GT for SDF-pruned voxels
Record.run_reconstruction_mesh: 0 # write run_reconstruction_mesh.rrd with GT mesh, SVRaster mesh, and nvblox mesh
Record.run_reconstruction_mesh_interval: 200 # mapper-iteration interval for SVRaster and nvblox mesh updates
Record.run_reconstruction_mesh_min_weight: 1e-4 # nvblox mesh_integrator_min_weight default
Record.run_reconstruction_mesh_weld_vertices: 1 # nvblox mesh_integrator_weld_vertices default
Record.run_reconstruction_mesh_max_vertices: 0 # 0:disable guard; >0:skip oversized Rerun snapshots instead of logging partial meshes
Record.run_reconstruction_mesh_max_faces: 0 # 0:disable guard; >0:skip oversized Rerun snapshots instead of logging partial meshes
Record.run_maps: 0 # write maps.rrd with final rendered-vs-GT RGB, depth, normal maps per keyframe
Record.run_maps_stride: 1 # log every Nth keyframe into maps.rrd

Record.save_nvblox_mesh_eval: 1 # RGB-D only: run nvblox and save one final reference mesh at shutdown
Record.load_saved_nvblox_mesh: 0 # RGB-D only: load an existing reference mesh instead of running nvblox
Record.saved_nvblox_mesh_path: "/home/dimitris/Photo-SLAM/results/tum_rgbd/rgbd_dataset_freiburg1_desk/nvblox"
Record.rerun_nvblox_mesh: 0 # log the saved/generated nvblox mesh in Rerun
Record.rerun_rendered_mesh_eval: 0 # log final voxel_surface_mesh.ply to world/voxel_model_mesh/final
Record.rerun_gt_mesh: 0 # log a reference GT mesh under world/gt/mesh
Record.rerun_gt_mesh_path: ""

Record.save_rendered_mesh_eval: 1 # 0:skip voxel_surface_mesh.ply shutdown export, 1:save it
Record.rendered_mesh_eval_voxel_size_m: 0.05 # final eval TSDF voxel size, comparable to HI-SLAM2 TSDF_VOXEL_SIZE
Record.rendered_mesh_eval_min_weight: 2.0 # final eval mesh extraction weight threshold, comparable to HI-SLAM2 TSDF_WEIGHT

##############################################################################
# SVRaster-style optimisation parameters
##############################################################################
Optimization.max_num_iterations: 30100
# SparseAdam param groups (match train.py)
Optimization.geo_lr: 0.1 #0.1 #0.025 # very important, 4x better than 8x
Optimization.sh0_lr: 0.01 #0.04 #0.01 # very important
Optimization.shs_lr: 0.00025 #0.00025 #important

# Optimizer hyper-params (match svraster cfg.optimizer)
Optimization.optim_beta1: 0.1
Optimization.optim_beta2: 0.99
Optimization.optim_eps: 1e-15

# MultiStep LR decay (like torch.optim.lr_scheduler.MultiStepLR)
# Use a YAML sequence for OpenCV FileStorage compatibility.
Optimization.lr_decay_ckpt: [19000] # [24]
Optimization.lr_decay_mult: 0.1

# --------------------------------------------------------------------------------------------
# Adaptive prune/subdivide (SVRaster schedule)
# --------------------------------------------------------------------------------------------
Optimization.adapt_from: 800
Optimization.adapt_every: 800
Optimization.prune_every: 800
Optimization.subdivide_every: 800

# Pruning heuristics
Optimization.filter_near_voxels: 1 # 0:false, 1:true, insertion-time mark_near filtering
Optimization.prune_far_voxels: 1 # 0:false, 1:true
Optimization.prune_near_voxels_geometric: 1 # 0:false, 1:true, prune-time near-to-camera geometry (also behind camera)
Optimization.prune_recent_unstable: 0
Optimization.prune_recent_keyframes: 8
Optimization.prune_recent_min_views_real: 3
Optimization.prune_recent_min_views_artificial: 3
Optimization.final_special_prune_enable: 0

# Pruning
Optimization.prune_until: 15000
Optimization.prune_thres_init: 0.001 
Optimization.prune_thres_final: 0.05 #0.05
Optimization.prune_thres_final_at_target: 0.05
Optimization.prune_thres_init_artificial: 0.05
Optimization.prune_thres_final_artificial: 0.05 # used for artificial rendered-hole-fill candidates until promotion

# Subdivision
Optimization.subdivide_until: 15000
Optimization.subdivide_all_until: 0 #worse probably because of re-initialization of optimizer
Optimization.subdivide_samp_thres: 0.8 #1.0
Optimization.subdivide_prop: 0.07 #0.05
Optimization.subdivide_max_num: 10000000

# Total variation loss of density grid
Optimization.lambda_tv_density: 0 #1e-10
Optimization.tv_from: 0
Optimization.tv_until: 1000

# Data augmentation
Optimization.ss_aug_max: 0 #1.5 

# Per-point rgb loss
Optimization.lambda_R_concen: 0.00 #0.01 

# Distortion loss (encourage distribution concentration on ray)
Optimization.lambda_dist: 0.00
Optimization.dist_from: 2500

# Final transmittance should concentrate to either 0 or 1
Optimization.lambda_T_concen: 0.0
# Final transmittance should be 0
Optimization.lambda_T_inside: 0.0

# SSIM loss
Optimization.lambda_ssim : 0.0
Optimization.lambda_dssim: 0.02
Optimization.use_l1: 0
Optimization.use_huber: 0
Optimization.huber_thres: 0.03

# Sparse depth loss
Optimization.lambda_sparse_depth : 0.0
Optimization.sparse_depth_until : 15000

# Dense RGB-D depth loss
Optimization.lambda_rgbd_depth : 0.001
Optimization.rgbd_depth_from : 1000
Optimization.rgbd_depth_end : 15000
Optimization.rgbd_depth_end_mult : 0.1

# RGB-D external sensor normal loss
Optimization.lambda_rgbd_normal: 0.0001
Optimization.rgbd_normal_from: 1000
Optimization.rgbd_normal_end: 15000
Optimization.rgbd_normal_end_mult: 0.1
Optimization.rgbd_normal_ks: 3
Optimization.rgbd_normal_tol_deg: 90.0

# Consistency loss of rendered normal and derived normal from expected depth
Optimization.lambda_normal_dmean: 0.00
Optimization.n_dmean_from: 1000
Optimization.n_dmean_end: 15000
Optimization.n_dmean_ks: 3
Optimization.n_dmean_tol_deg: 90.0

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------

VoxelViewer.glfw_window_width: 1400
VoxelViewer.glfw_window_height: 1050
VoxelViewer.image_scale: 0.5
VoxelViewer.image_scale_main: 1.0
VoxelViewer.camera_watch_dist: 0.000001
