%YAML:1.0

# Waymo FRONT camera with projected LiDAR depth. This configuration preserves
# the monocular ORB-driven map and uses LiDAR only to fill residual render holes.

Model.sh_degree: 3
Model.resolution: -1.0
Model.white_background: 0
Model.eval: 0
Model.outside_level: 5
Model.global_scene_extent: 0
# RGB-D ORB points are metric and include distant depth outliers; estimate the
# automatic ORB scene bound robustly before constructing the uniform support.
Model.robust_scene_bounds: 1

Pipeline.convert_SHs: 0
Camera.z_near: 0.01
RGBD.min_depth: 1.0
RGBD.max_depth: 75.0

Mapper.geometry_mode: "svrecon_sdf"
# Match the successful monocular topology: the initial ORB MapPoints define the
# automatic scene layout and initialize the uniform SVRecon support.
Mapper.svrecon_uniform_support: 1
Mapper.svrecon_uniform_growth_margin_vox: 0.0
Mapper.allocate_orb_voxels: 1
# Do not replace the ORB field with a global LiDAR prior or allocate every return.
Mapper.rgbd_surface_point_allocation: 0
Mapper.sdf_initialization_rgbd_projective: 0
Mapper.svrecon_ray_support: 0
Mapper.octree_block_support: 0
Mapper.octree_block_support_initial_backfill: 0
Mapper.octree_block_support_block_size_vox: 8
Mapper.octree_block_support_pixel_stride: 2
Mapper.octree_block_support_trunc_vox: 3.0
Mapper.sdf_initialization_mode: "orb_prior"
# Initial and incremental ORB points initialize corners within this radius.
# LiDAR does not enter the global nearest-point prior.
Mapper.sdf_initialization_orb_radius_vox: 1.0
Mapper.inactive_geo_densify: 0
Mapper.inactive_geo_densify_max_pixel_dist: 1.0
Mapper.depth_cache: 10
# Render ORB first, then use valid LiDAR depth only at residual hole pixels.
Mapper.rgbd_fill_render_holes: 1
Mapper.rgbd_fill_render_holes_initial_backfill: 1
Mapper.rgbd_fill_render_holes_stride: 1
# Waymo-only: initialize SDF locally from LiDAR at residual hole pixels.
Mapper.rgbd_fill_render_holes_projective_sdf: 1
# Match the saved monocular map's initial octree level (11) in metric Waymo
# coordinates. The monocular 0.005 value is tied to its arbitrary SLAM scale.
Mapper.sdf_voxel_size_m: 2.0
Mapper.sdf_init_trunc_vox: 4.0
Mapper.sdf_init_max_depth_m: 75.0

Mapper.min_num_initial_map_kfs: 10
Mapper.new_keyframe_times_of_use: 2
Mapper.local_BA_increased_times_of_use: 0
Mapper.loop_closure_increased_times_of_use_: 2
Mapper.cull_keyframes: 0
Mapper.large_rotation_threshold: 20.0
Mapper.large_translation_threshold: 1.0

GausPyramid.do: 1
GausPyramid.num_sub_levels: 2
GausPyramid.sub_level_times_of_use: 8

Record.keyframe_record_interval: 0
Record.all_keyframes_record_interval: 0
Record.record_rendered_image: 1
Record.record_ground_truth_image: 1
Record.record_loss_image: 0
Record.training_report_interval: 100
Record.record_loop_ply: 0
Record.enable_rerun: 0
Record.rerun_max_keyframes: -1
Record.rerun_keyframe_start: 0
Record.run_whole_run: 0
Record.rerun_svrecon_debug: 0
Record.run_reconstruction_mesh: 0
Record.run_reconstruction_mesh_interval: 500
Record.run_reconstruction_mesh_min_weight: 1e-4
Record.run_reconstruction_mesh_weld_vertices: 1
Record.run_reconstruction_mesh_max_vertices: 0
Record.run_reconstruction_mesh_max_faces: 0
Record.run_maps: 0
Record.run_maps_stride: 1
Record.rerun_rendered_mesh_eval: 0
Record.rerun_gt_mesh: 0
Record.save_rendered_mesh_eval: 1
Record.rendered_mesh_eval_voxel_size_m: 0.1
Record.rendered_mesh_eval_min_weight: 1.0
Record.rendered_mesh_eval_trunc_vox: 8.0
Record.rendered_mesh_eval_depth_max_m: 75.0
Record.svrecon_mesh_init_lv: 7
Record.svrecon_mesh_final_lv: 9
Record.svrecon_mesh_trunc_lv: 10
Record.svrecon_mesh_trunc_vox: 5.0
Record.svrecon_mesh_pg_prune: 0.6
Record.svrecon_mesh_crop_border: 0.01
Record.svrecon_mesh_alpha_thres: 0.5
Record.svrecon_mesh_use_mean_depth: 0
Record.svrecon_mesh_use_vert_color: 1

Optimization.max_num_iterations: 30100
Optimization.geo_lr: 0.025
Optimization.sh0_lr: 0.01
Optimization.shs_lr: 0.00025
Optimization.optim_beta1: 0.1
Optimization.optim_beta2: 0.99
Optimization.optim_eps: 1e-15
Optimization.lr_decay_ckpt: [19000]
Optimization.lr_decay_mult: 0.1

Optimization.adapt_every: 600
Optimization.prune_every: 600
Optimization.subdivide_every: 600
Optimization.prune_from: 600
Optimization.prune_until: 15000
Optimization.prune_thres_init: 0.001
Optimization.prune_thres_final: 0.1
Optimization.prune_thres_final_at_target: 0.1
Optimization.filter_near_voxels: 0
Optimization.prune_far_voxels: 0
Optimization.prune_near_voxels_geometric: 0
# Keep SVRecon's SDF pruning for uniform support. Depth-view pruning would
# collapse the volumetric support back to only the sparse LiDAR returns.
Optimization.prune_surface_views_enable: 0
Optimization.final_surface_prune_enable: 0
Optimization.final_surface_min_views: 1
Optimization.final_surface_depth_tolerance_vox: 2.0
Optimization.final_surface_min_sdf_span_vox: 0.05
Optimization.final_surface_keep_connected: 0
Optimization.final_surface_connected_hops: 2
Optimization.subdivide_from: 400
Optimization.subdivide_all_until: 0
Optimization.subdivide_samp_thres: 0.5
Optimization.subdivide_prop: 0.1

Optimization.lambda_tv_density: 0.0
Optimization.tv_from: 0
Optimization.tv_until: 10000
Optimization.lambda_ge_density: 0.0
Optimization.ge_from: 0
Optimization.ge_until: 6000
Optimization.lambda_ls_density: 0.0
Optimization.ls_from: 0
Optimization.ls_until: 8000

Optimization.ss_aug_max: 0.0
Optimization.lambda_R_concen: 0.0
Optimization.lambda_dist: 0.0
Optimization.dist_from: 2500
Optimization.lambda_T_concen: 0.0
Optimization.lambda_T_inside: 0.0
Optimization.lambda_ssim: 0.02
Optimization.use_l1: 0
Optimization.use_huber: 0
Optimization.huber_thres: 0.03

Optimization.lambda_sparse_depth: 0.0
Optimization.sparse_depth_until: 15000

# Sparse projected LiDAR directly supervises rendered depth at valid pixels.
Optimization.lambda_rgbd_depth: 0.001
Optimization.rgbd_depth_from: 0
Optimization.rgbd_depth_end: 15000
Optimization.rgbd_depth_end_mult: 0.1

# Do not infer dense free space or normals from sparse LiDAR image pixels.
Optimization.lambda_rgbd_sdf: 0.0
Optimization.rgbd_sdf_from: 0
Optimization.rgbd_sdf_end: 0
Optimization.rgbd_sdf_end_mult: 0.0
Optimization.rgbd_sdf_trunc_vox: 4.0
Optimization.rgbd_sdf_max_samples: 0
Optimization.rgbd_sdf_ray_pixels: 0
Optimization.rgbd_sdf_free_samples: 0
Optimization.rgbd_sdf_surface_samples: 0
Optimization.rgbd_sdf_w_fs: 0.0
Optimization.rgbd_sdf_w_center: 0.0
Optimization.rgbd_sdf_w_tail: 0.0
Optimization.lambda_rgbd_normal: 0.0
Optimization.rgbd_normal_from: 0
Optimization.rgbd_normal_end: 0
Optimization.rgbd_normal_end_mult: 0.0
Optimization.rgbd_normal_ks: 3
Optimization.rgbd_normal_tol_deg: 90.0
Optimization.lambda_normal_dmean: 0.0
Optimization.n_dmean_from: 1000
Optimization.n_dmean_end: 15000
Optimization.n_dmean_ks: 3
Optimization.n_dmean_tol_deg: 90.0

VoxelViewer.glfw_window_width: 1400
VoxelViewer.glfw_window_height: 1050
VoxelViewer.image_scale: 0.5
VoxelViewer.image_scale_main: 1.0
VoxelViewer.camera_watch_dist: 0.000001
